<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Limit Reached • MindLedger Focus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-app: #F8FAFC;
      --bg-surface: #FFFFFF;
      --text-main: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --primary-500: #2563EB;
      --primary-600: #1D4ED8;
      --rose-500: #F43F5E;
      --rose-50: #FFF1F2;
      --border-color: #E2E8F0;
      --radius-lg: 16px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-app);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .focus-container {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      max-width: 520px;
      width: 100%;
      padding: 48px 40px;
      text-align: center;
    }

    .icon-badge {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--rose-50);
      color: var(--rose-500);
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .description {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .domain-chip {
      background: #F1F5F9;
      color: #0F172A;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      border: none;
    }

    .btn-primary {
      background: var(--primary-500);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background: var(--primary-600);
    }

    .btn-secondary {
      background: #F1F5F9;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: #E2E8F0;
    }

    .footer-note {
      margin-top: 32px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="focus-container">
    <div class="icon-badge">🛡️</div>
    <h1 class="title">Daily Screen Time Limit Reached</h1>
    <p class="description">
      You have reached your daily digital wellbeing quota for <span id="blocked-domain" class="domain-chip">this website</span>. Take a healthy break or refocus on high-priority tasks!
    </p>

    <div class="btn-group">
      <button id="btn-snooze" class="btn btn-secondary">
        ⏳ Emergency Snooze (+5 Minutes)
      </button>
      <a href="http://127.0.0.1:8787/dashboard" class="btn btn-primary">
        📊 Open MindLedger Dashboard
      </a>
    </div>

    <div class="footer-note">
      Protected locally by MindLedger • Private & Offline First
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const domain = params.get('domain') || 'this website';
    const limitId = params.get('limit_id');
    const returnUrl = params.get('url');

    document.getElementById('blocked-domain').textContent = domain;

    const snoozeBtn = document.getElementById('btn-snooze');
    if (!limitId) {
      snoozeBtn.style.display = 'none';
    } else {
      snoozeBtn.addEventListener('click', async () => {
        snoozeBtn.disabled = true;
        snoozeBtn.textContent = 'Granting snooze pass...';
        try {
          const res = await fetch(`http://127.0.0.1:8787/api/v1/limits/${limitId}/snooze`, {
            method: 'POST',
          });
          const data = await res.json();
          if (data.success) {
            if (returnUrl) {
              window.location.href = decodeURIComponent(returnUrl);
            } else {
              window.location.href = `https://${domain}`;
            }
          } else {
            alert(data.error || 'Daily snooze limit reached.');
            snoozeBtn.textContent = 'Snooze Limit Reached';
          }
        } catch (e) {
          alert('Could not connect to MindLedger backend.');
          snoozeBtn.textContent = 'Connection Error';
        }
      });
    }
  </script>
</body>
</html>
