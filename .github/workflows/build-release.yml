name: Build & Release MindLedger

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable & Extension
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Frontend Dependencies & Build Dashboard
        working-directory: ./dashboard
        run: |
          npm ci
          npm run build

      - name: Package Chrome Extension ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path chrome_extension/* -DestinationPath dist/mindledger-chrome-extension.zip -Force

      - name: Compile Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --clean mindledger.spec

      - name: Package Portable Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/MindLedger -DestinationPath dist/MindLedger-Windows-Portable.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: MindLedger ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/MindLedger-Windows-Portable.zip
            dist/mindledger-chrome-extension.zip
